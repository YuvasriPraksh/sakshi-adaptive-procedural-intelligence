version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sakshi_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sakshi:sakshi_pass@db:5432/sakshi_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - sakshi_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sakshi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sakshi
      POSTGRES_PASSWORD: sakshi_pass
      POSTGRES_DB: sakshi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sakshi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakshi -d sakshi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── pgAdmin (optional, for DB management) ────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sakshi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sakshi.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - sakshi_network
    profiles:
      - tools   # Only starts with: docker-compose --profile tools up

volumes:
  postgres_data:
    driver: local

networks:
  sakshi_network:
    driver: bridge
